name: Release

# Tag-driven: `git tag v0.1.0-alpha.1 && git push --tags` publishes a draft-free prerelease with the
# mod zip and a ready-to-run terminal per OS. `workflow_dispatch` builds the same artifacts without
# publishing anything, so the packaging can be exercised before a tag is spent on it.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

# A release must never be cancelled halfway through by a second push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read by default, and write only in `publish`, which is the one job that creates anything. The
# build jobs run third-party actions and pull packages off the network; a called workflow
# (`ci.yml`) inherits whatever is granted here, so a workflow-level write reaches further than
# anything below actually needs.
permissions:
  contents: read

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      mod_version: ${{ steps.v.outputs.mod_version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # Build-only checkouts push nothing back, so the token stays out of .git.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Tags, which a shallow clone has none of: the dry run names itself after the last release.
          fetch-depth: 0

      # The tag is the only place a version is authored. Nothing in the tree carries one to keep in
      # step with it -- both files that used to are dummies now, and both real numbers are derived
      # here and handed to the builds. What is checked is the artifact rather than the source: see
      # the packed-zip check in `mod`, which is where a version can still go missing.
      - name: Resolve version
        id: v
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Named after the last release rather than a made-up number, so a dry run exercises the
            # shape a real one has. Before the first tag exists there is nothing to name it after,
            # and 0.0.0 is as good as anything.
            base=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)
            version="${base#v}-dev.${{ github.run_number }}"
            publish=false
          else
            version="${GITHUB_REF_NAME#v}"
            publish=true
          fi

          # Insisting on the tag's shape is the whole check now, so it is worth being strict: a
          # prerelease has to be *numbered*, because that number is the only thing separating two
          # alphas once they reach the game (see mod_version). jpackage takes the numeric head and
          # accepts three components at most, which is the other half of why this is the shape.
          #
          # The counter is [1-9][0-9]*, not [0-9]+, on both counts a number can be written twice:
          # `-beta.0` would derive the same 0.1.0.0 as the final release v0.1.0, leaving the game
          # with no update to offer between them, and `-alpha.01` the same 0.1.0.1 as `-alpha.1`
          # from a tag that does not look like it. Semver bars leading zeros here for that reason.
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*\.([1-9][0-9]*))?$ ]]; then
            echo "::error::version '$version' is not MAJOR.MINOR.PATCH[-<name>.<n>], n from 1 and unpadded"
            exit 1
          fi
          numeric="${BASH_REMATCH[1]}"

          # FS25's modDesc version is four numbers and can express nothing else, so the prerelease
          # counter becomes the fourth: 0.1.0-alpha.2 ships as 0.1.0.2, a final release as 0.1.0.0.
          # Flattening every prerelease to .0 instead would leave the game unable to tell one alpha
          # from the next, and so unable to offer players the update.
          mod_version="$numeric.${BASH_REMATCH[4]:-0}"

          {
            echo "version=$version"
            echo "mod_version=$mod_version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "terminal $version, mod $mod_version, publish=$publish"

  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  mod:
    name: Mod zip
    needs: [ version, verify ]
    runs-on: ubuntu-latest
    env:
      # The same `fs pack` used locally, so the released zip and the one on the developer's machine
      # come out of one definition of "what is the mod" — `.fsignore` — instead of CI keeping a
      # second list that silently drifts when an asset folder is added.
      #
      # Pinned to a release, not a branch: on `main`, a change over there would quietly change what
      # ships from here. Bump it deliberately, and re-run the dry run when you do.
      #
      # v0.2.0 is the floor: `--mod-version` arrived there, and without it the mod would ship with
      # the placeholder that modDesc.xml now carries on disk.
      FSTOOLS: git+https://github.com/VertexDezign/FSTools@v0.2.1
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # Every path the mod source()s must actually be in the tree. A typo here is a mod that loads
      # halfway and then errors in someone's savegame, which no unit test covers.
      - name: Verify sourced files exist
        working-directory: vdTelemetry
        run: |
          set -euo pipefail
          fail=0
          while read -r f; do
            [ -f "$f" ] || { echo "::error::sourceFiles entry not found: $f"; fail=1; }
          done < <(sed -n '/^local sourceFiles = {/,/^}/p' VDTelemetry.lua | grep -oP '"\K[^"]+\.lua(?=")')
          exit $fail

      - name: Validate modDesc.xml
        working-directory: vdTelemetry
        run: uvx --from "$FSTOOLS" fs validate

      # `fs pack` rewrites author/title into the packed modDesc.xml from fstools.toml, and the
      # version from `--mod-version` -- all three inside the zip, leaving the file on disk alone.
      # That is what lets modDesc.xml hold a placeholder and still ship the tag's number.
      - name: Build FS25_vdTelemetry.zip
        working-directory: vdTelemetry
        env:
          MOD_VERSION: ${{ needs.version.outputs.mod_version }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          uvx --from "$FSTOOLS" fs pack --mod-version "$MOD_VERSION" -o "$GITHUB_WORKSPACE/dist"

      # Independent of whatever packed it: the zip is opened and asked whether it is a working mod.
      # `.fsignore` is an exclude list, so the failure mode it cannot catch is a *new* repo-only
      # file quietly shipping to players — which is exactly how fsTypes/ and stylua.toml got in.
      - name: Verify the packed zip
        env:
          MOD_VERSION: ${{ needs.version.outputs.mod_version }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import os, re, sys, zipfile, pathlib
          zf = zipfile.ZipFile("dist/FS25_vdTelemetry.zip")
          names = set(zf.namelist())
          bad = []

          if "modDesc.xml" not in names:
              bad.append("modDesc.xml is not at the zip root")
          else:
              # The version the tag asked for, read back out of the artifact. Nothing in the tree
              # carries it any more, so `--mod-version` silently not applying is the one way this
              # release still ships a wrong number -- and it would ship as the placeholder, which
              # the game reads as "no update available" forever.
              want = os.environ["MOD_VERSION"]
              m = re.search(r"<version>([^<]*)</version>",
                            zf.read("modDesc.xml").decode("utf-8-sig"))
              got = m.group(1) if m else None
              if got != want:
                  bad.append(f"packed modDesc.xml says version {got!r}, expected {want!r}")

          # .png among them: the icon ships as .dds, so every png in the mod folder is a source the
          # icon was drawn from -- a quarter-megabyte apiece that no player has any use for.
          leaked = sorted(n for n in names
                          if n.startswith(("spec/", "fsTypes/"))
                          or n.endswith((".md", ".toml", ".fsignore", ".png")))
          bad += [f"repo-only file shipped: {n}" for n in leaked]

          block = re.search(r"^local sourceFiles = \{(.*?)^\}",
                            pathlib.Path("vdTelemetry/VDTelemetry.lua").read_text(),
                            re.S | re.M).group(1)
          sourced = re.findall(r'"([^"]+\.lua)"', block)
          bad += [f"sourced file missing from zip: {s}" for s in sourced if s not in names]

          for b in bad:
              print(f"::error::{b}")
          print(f"{len(names)} files, {len(sourced)} sourced modules, {len(bad)} problem(s)")
          sys.exit(1 if bad else 0)
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: mod
          path: dist/
          if-no-files-found: error

  # The dashboard's wasm bundle, built once on Linux for every download.
  #
  # It is the same bytes whoever builds it — no per-OS content, and nothing the release version
  # reaches — so the only reason it was ever built per runner was that it sat in the same Gradle
  # invocation as jpackage. Splitting it off is what keeps the Kotlin/Wasm npm install away from
  # the Windows runner, where it repeatedly failed to leave a usable node_modules behind and took
  # the release with it. `--no-parallel` for the same install's sake: two concurrent yarn processes
  # share one cache, which is the race that made it flaky here in the first place.
  web:
    name: Dashboard bundle
    needs: [ version, verify ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VDTerminal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the dashboard bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./gradlew :app:wasmJsBrowserDistribution -PvdtVersion="$VERSION" --no-parallel --stacktrace

      # if-no-files-found: error, so an empty bundle fails here rather than becoming a blank page
      # in three downloads.
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: VDTerminal/app/build/dist/wasmJs/productionExecutable
          if-no-files-found: error

  terminal:
    name: Terminal (${{ matrix.label }})
    needs: [ version, verify, web ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: VDTerminal
        # bash on both runners, not just Linux: the Windows default is PowerShell, where `./gradlew`
        # tries to run the POSIX script as a program instead of handing it to a shell.
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same 25 CI builds on, and the floor the project documents: jpackage bundles the runtime
      # it is run from, so this number is both what the two app images ship and what the portable
      # zip demands of the JDK a user brings. `--enable-native-access` travels with it, from
      # `server/build.gradle.kts` — see the comment there for what Netty does without it.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Into build/, which is git-ignored, so a local run of the same commands leaves nothing behind.
      - name: Fetch the dashboard bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: VDTerminal/build/web-bundle

      # jpackage cannot cross-compile, which is the whole reason this job is a matrix. Only jpackage
      # is: `-PvdtWebBundle` hands the server the bundle the `web` job already built, so what runs
      # here is Kotlin/JVM and jpackage and nothing else — no node, no yarn, no webpack. The build
      # script fails outright if the bundle didn't arrive, rather than packaging a blank dashboard.
      #
      # The version reaches the shell through `env:` rather than being expanded into the script:
      # it is derived from the pushed tag name, and a tag name is free text that would otherwise
      # be pasted straight into a command line.
      - name: Build app image
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ./gradlew :server:packageRelease \
            -PvdtVersion="$VERSION" -PvdtWebBundle=build/web-bundle --stacktrace

      # The bring-your-own-JDK archive, for anything the two app images don't cover. Built once.
      - name: Build portable archive
        if: matrix.label == 'linux'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ./gradlew :server:distZip -PvdtVersion="$VERSION" -PvdtWebBundle=build/web-bundle
          mv "server/build/distributions/server-${VERSION}.zip" \
             "server/build/release/VDTerminal-${VERSION}-portable.zip"

      # The archive, not the build output: the two differ, and the difference has already been a
      # release-blocking bug once — Gradle's archive tasks normalise permissions, so the app image
      # ran fine while the download it was packed into arrived with an unrunnable launcher.
      - name: Smoke test the packaged archive
        run: |
          set -euo pipefail
          mkdir -p smoke && cd smoke
          # Expand-Archive rather than unzip or tar: Git for Windows ships neither `unzip` nor a tar
          # that reads zip, and PowerShell is the one extractor certain to be on the runner. The
          # relative path keeps it working without converting between msys and Windows path forms.
          if [ "${{ matrix.label }}" = "windows" ]; then
            powershell -NoProfile -Command \
              "Expand-Archive -Path '../server/build/release/VDTerminal-*.zip' -DestinationPath '.' -Force"
            launcher="VDTerminal/VDTerminal.exe"
          else
            tar xzf ../server/build/release/*.tar.gz
            launcher="VDTerminal/bin/VDTerminal"
          fi
          [ -x "$launcher" ] || { echo "::error::$launcher is not executable in the archive"; exit 1; }

          # The licences and the setup guides are only ever seen here, so a build that silently
          # dropped them is a broken release rather than a cosmetic one.
          for f in LICENSE NOTICE licenses/DSEG-OFL-1.1.txt setup.en.md setup.de.md; do
            [ -f "$f" ] || { echo "::error::$f is missing from the archive"; exit 1; }
          done

          VDT_PORT=3999 VDT_GAME_DIR=/nonexistent "$launcher" > run.log 2>&1 &
          pid=$!
          # On a trap, not at the end: under `set -e` a server that never comes up exits the step
          # at the first curl, and the startup log is the only thing that could say why.
          trap 'echo "--- startup log ---"; cat run.log || true; kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3999/health >/dev/null 2>&1 && break || sleep 1
          done
          curl -sf http://localhost:3999/health
          # The dashboard and its wasm bundle, i.e. that the app really is embedded in the jar.
          curl -sf -o /dev/null http://localhost:3999/
          curl -sf -o /dev/null http://localhost:3999/app.js

          # The console window is the whole UI this program has before the browser opens, so a JVM
          # warning in it is a defect. `WARNING:` at the start of a line is the JVM's own format --
          # restricted native access and terminally deprecated methods both arrive that way, and
          # both are what --enable-native-access is passed to prevent.
          if grep -q '^WARNING' run.log; then
            echo "::error::the packaged runtime prints a JVM warning on startup"; exit 1
          fi

      # The portable zip carries the same fonts inside the jar, so it owes the same attribution —
      # and it is the one archive the smoke test above never unpacks.
      - name: Verify the portable archive ships its notices
        if: matrix.label == 'linux'
        run: |
          set -euo pipefail
          zip=$(echo server/build/release/*-portable.zip)
          # Listed once into a variable: `unzip -Z1 | grep -q` would leave unzip writing into a
          # pipe grep has already closed, and pipefail reads that SIGPIPE as a failed check.
          names=$(unzip -Z1 "$zip")
          for f in LICENSE NOTICE licenses/DSEG-OFL-1.1.txt setup.en.md setup.de.md; do
            grep -qE "(^|/)$f\$" <<<"$names" || { echo "::error::$f is missing from $zip"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: terminal-${{ matrix.label }}
          path: VDTerminal/server/build/release/
          if-no-files-found: error

  publish:
    name: Publish prerelease
    needs: [ version, mod, terminal ]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The only job that writes anything back, and the only one granted it.
    permissions:
      contents: write
    steps:
      # Only so `gh` can read the repo off the remote; it authenticates with GH_TOKEN below.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Named, not "everything this run produced": `dist/*` becomes the release's asset list, and
      # the run also carries the intermediate `web-bundle` the terminal jobs were built from, which
      # has no business being a download.
      - uses: actions/download-artifact@v8
        with:
          name: mod
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: terminal-*
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          **This is an alpha.** It is usable, it is not finished, and it is unsigned — Windows
          SmartScreen and some antivirus tools will say so.

          ### Setup

          - 📖 [Setup guide (English)](https://github.com/VertexDezign/VDTelemetry/blob/main/docs/setup.en.md)
          - 📖 [Anleitung (Deutsch)](https://github.com/VertexDezign/VDTelemetry/blob/main/docs/setup.de.md)

          You need **two** mods in your `mods` folder: `FS25_vdTelemetry.zip` from below, and
          [FS25_additionalInputs](https://github.com/VertexDezign/AdditionalInputs/releases) 1.1+,
          without which VDTelemetry switches itself off.

          ### Which download

          | File | For |
          |---|---|
          | `FS25_vdTelemetry.zip` | the mod — into your FS25 `mods` folder |
          | `VDTerminal-…-windows-x64.zip` | the dashboard on Windows — unzip, run `VDTerminal.exe` |
          | `VDTerminal-…-linux-x64.tar.gz` | the dashboard on Linux (Proton players) |
          | `VDTerminal-…-portable.zip` | anything else — needs a JDK 25+ of your own |

          The three terminal downloads are the same program; the first two bring their own Java.

          The dashboard has no password and is meant for your own network. Don't forward port 3001.
          EOF

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "VDTelemetry $VERSION" \
            --notes-file notes.md \
            --prerelease
